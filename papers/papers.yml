# Paper status registry -- the single source of truth for paper status on the website.
#
# Edit with:  python scripts/paper_status.py set|event|add|list|check|build ...
# Hand edits are fine too; then run `paper_status.py build`. Comments other than this
# header are not preserved when the script rewrites the file.
#
# status:     accepted | in-review | wip | working-paper
# substatus:  free text, e.g. submitted, under review, major revision, minor revision, in press
# events:     dated public milestones (presentations, submissions, acceptance), newest shown first
# wip:        only id/label, summary and events are published -- never title, abstract or links,
#             and never a subpage under papers/<slug>/.
