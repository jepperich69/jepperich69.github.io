  substatus: published
  title: 'On the theoretical distribution of cost overruns: A lognormal baseline'
  authors: Jeppe Rich
  venue: Transportation Research Part A
  year: 2026
  volume: Vol. 212, 105189
  slug: optimism-bias-part-a
  featured: true
  summary: Develops a two-level stochastic framework showing how multiplicative within-project updates
    yield a lognormal cost-ratio baseline while portfolio-level right-skewness diagnoses correlated shocks
    across projects.
